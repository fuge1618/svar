<meta name="robots" content="noindex">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Svar">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-width='3.2' stroke-linecap='square'%3E%3Crect width='32' height='32' rx='7' fill='%23E9E8E4'/%3E%3Cpath d='M6 17l7 7' stroke='%23FF8000'/%3E%3Cpath d='M13 24L26 8' stroke='%231A1A19'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de celular (max 560px); ficha técnica gris, tinta casi negra, un solo acento papaya. */
:root{
  --bg:#E9E8E4; --surface:#F6F5F2; --ink:#1A1A19; --muted:#63615C; --line:#D0CEC7;
  --accent:#FF8000; --on-accent:#1A1A19; --ok:#2C7A4B;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1D1D1B; --ink:#ECEBE6; --muted:#9D9B94; --line:#34332F;
    --accent:#FF8000; --on-accent:#1A1A19; --ok:#74C391; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1D1D1B; --ink:#ECEBE6; --muted:#9D9B94; --line:#34332F;
  --accent:#FF8000; --on-accent:#1A1A19; --ok:#74C391; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px}
main{flex:1;display:flex;flex-direction:column;gap:20px;padding:8px 0 28px}

/* marca */
.brand{display:flex;align-items:center;gap:12px;padding:22px 0 6px}
.brand svg{width:34px;height:34px;flex:none}
.brand .name{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand .by{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.brand .sp{flex:1}
.icon{border:1px solid var(--line);background:transparent;border-radius:8px;width:40px;height:40px;display:grid;place-items:center}
.icon svg{width:18px;height:18px}
.lema{color:var(--muted);margin:0}

/* barra superior de pantallas internas */
.bar{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.bar .t{font-weight:600;flex:1;text-align:center}
.bar .cnt{color:var(--muted);font-size:13px;min-width:72px;text-align:right}
.ghost{border:0;background:transparent;padding:8px 4px;color:var(--muted);min-width:72px;text-align:left}

/* secciones */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.sec>h2,.sec>summary{margin:0;padding:10px 14px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sec>h2::before,.sec>summary::before{content:"";width:14px;height:3px;background:var(--accent);flex:none}
.sec>summary{cursor:pointer;list-style:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .r{margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
details.sec:not([open])>summary{border-bottom:0}
.pad{padding:14px}

/* lista de cuestionarios */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:64px}
.row:last-child{border-bottom:0}
.row .code{font-family:var(--mono);font-weight:600;font-size:17px;min-width:92px}
.row .meta{flex:1;color:var(--muted);font-size:13px}
.row .mini{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.row .mini i{display:block;height:100%;background:var(--accent)}
.pill{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.go{border-color:var(--accent);color:var(--ink)}
.chev{color:var(--muted)}

/* botones */
.btn{border:1px solid var(--ink);background:transparent;border-radius:10px;padding:13px 16px;font-weight:500;min-height:48px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.soft{border-color:var(--line)}
.btn.danger{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.btn.seg{font-size:14px;padding:10px 8px}
.btn.seg.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{color:var(--muted);font-size:13px;margin:0}

/* pregunta */
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qhead{min-height:9.2em;display:flex;flex-direction:column;gap:10px;justify-content:flex-start;padding-top:10px}
.qn{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.qn::before{content:"";width:18px;height:3px;background:var(--accent)}
.qt{font-size:21px;line-height:1.3;font-weight:500;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:13px;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt .mk{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;flex:none;display:grid;place-items:center}
.opt[role=checkbox] .mk{border-radius:5px}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;width:1ch}
.sec.test>summary{font-size:12px}
.sec.test>summary .tcode{font-size:20px;letter-spacing:0;text-transform:none}
.sub{margin:0;padding:12px 14px 6px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 14px 10px}
.cell{display:flex;align-items:baseline;justify-content:space-between;gap:4px;border:1px solid var(--line);border-radius:7px;background:transparent;padding:7px 8px;font-family:var(--mono);min-height:38px}
.cell span{font-size:12px;color:var(--muted)}
.cell b{font-size:15px}
.cell.none b{color:var(--muted);font-weight:400}
.legend{padding:2px 14px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line)}
.legend b{display:inline-block;width:1.6ch}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.on .mk{border-color:var(--accent);background:var(--accent)}
.opt.on .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.opt[role=checkbox].on .mk::after{border-radius:2px}
.nav{position:sticky;bottom:0;background:var(--bg);display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:10px 0 16px;border-top:1px solid var(--line)}

/* tablero */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);text-align:left;text-transform:uppercase;letter-spacing:.06em}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);color:var(--muted);width:1%;white-space:nowrap;padding-right:4px}
.ans{display:block;margin-top:3px;font-weight:600}
.ans.none{color:var(--muted);font-weight:400}
tr.tap{cursor:pointer}
dl.datos{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.datos dt{color:var(--muted)}
dl.datos dd{margin:0}

/* formularios */
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px}
.field{margin:0}
.msg{border-left:3px solid var(--accent);padding:10px 12px;background:var(--surface);font-size:14px;border-radius:0 8px 8px 0}
.big{font-size:24px;font-weight:600;margin:18px 0 0;line-height:1.2;text-wrap:balance}
textarea{width:100%;min-height:180px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px}

/* inicio animado */
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;animation:out .35s 1.25s forwards}
#splash .in{display:flex;flex-direction:column;align-items:center;gap:14px}
#splash svg{width:84px;height:84px}
#splash .l1{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .3s .15s forwards}
#splash .l2{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .45s .4s forwards}
#splash .w{opacity:0;animation:up .4s .75s forwards;text-align:center}
#splash .w b{font-size:28px;font-weight:600;display:block;line-height:1}
#splash .w span{font-family:var(--mono);font-size:11px;color:var(--muted)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{display:none}.prog i{transition:none}}
.filebtn{display:grid;place-items:center;cursor:pointer;margin:0;font-size:16px;color:var(--ink)}
a.btn{display:block;text-decoration:none;color:var(--ink)}
a.btn.pri{color:var(--on-accent)}
input[type=email]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal{display:flex;align-items:center;gap:10px;padding:12px 10px;border:2px solid;border-radius:10px;font-weight:500;min-height:54px;text-align:left;font-size:15px}
.pal .chips{display:flex;gap:3px;flex:none}
.pal .chips i{width:12px;height:24px;border-radius:3px;display:block}
.mailbox{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px}
.mailbox span{overflow-wrap:anywhere}
.mailbox .btn{min-height:40px;padding:8px 12px;flex:none}
.librow{display:flex;gap:8px;align-items:stretch}
.librow .opt{flex:1;min-width:0}
.keybtn{flex:none;min-height:54px;padding:8px 12px;font-size:13px;font-family:var(--mono)}
.keybtn.has{border-color:var(--ok);color:var(--ok)}
.opt.pac{align-items:center;text-align:left}
table.pts td,table.pts th{padding:8px 14px}
table.pts tr.tot td{font-weight:600}
table.pts td.inc{color:var(--accent)}
details.resp{border-top:1px solid var(--line);margin-top:12px}
details.resp>summary{padding:12px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
div.cell{cursor:default}
.sec>h2 .tcode{font-size:18px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink)}
input[type=email],input[type=tel],input[type=time],input[type=search],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px;color:var(--ink);font:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 10px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px;font:inherit}
button.stat{cursor:pointer}
.stat b{font-family:var(--mono);font-size:26px;line-height:1}
.stat span{font-size:12px;color:var(--muted);line-height:1.25}
.lrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.sec>.lrow:last-child{border-bottom:0}
div.lrow{cursor:default}
.lrow[hidden]{display:none}
.lrow .g{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lrow .g small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.lrow .h{font-size:13px;color:var(--muted);min-width:44px;font-weight:400}
.lrow .ch{color:var(--muted)}
.btn.mini{min-height:36px;padding:6px 10px;font-size:13px;flex:none;width:auto}
textarea.ta{min-height:64px;font-family:inherit;font-size:15px}
.edi{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.edr{display:flex;gap:8px;align-items:flex-start}
.edr .edn{width:58px;flex:none;text-align:center;font-family:var(--mono);padding:12px 4px}
.edr input,.edr textarea{min-width:0;flex:1}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:0}
.chk input{width:20px;height:20px}
#app.shell{max-width:none;padding:0;flex-direction:row;align-items:flex-start}
.shell .page{flex:1;min-width:0;max-width:592px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;min-height:100vh}
.shell .page.wide{max-width:1180px}
.side{width:232px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;z-index:20}
.side .sb{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.side .sb svg{width:28px;height:28px}
.side .name{font-size:20px;font-weight:600;line-height:1}
.side .by{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.navi{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:8px;color:var(--ink);font:inherit;text-align:left;width:100%}
.navi svg{width:20px;height:20px;flex:none;color:var(--muted)}
.navi:hover{background:var(--bg)}
.navi.on{background:var(--bg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.navi.on svg{color:var(--ink)}
.navi .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px;overflow-wrap:anywhere}
.scrim{display:none}
.burger{display:none}
.brand .bm{display:none}
.caltb{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.caltb .calt{flex:1;font-weight:600;font-size:18px;min-width:150px;padding:0 6px;text-transform:capitalize}
.wstrip{display:none;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;min-height:66px}
.wd span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.wd b{font-size:17px}
.wd i{font-style:normal;font-size:10px;font-family:var(--mono);min-height:14px;min-width:14px;border-radius:7px;background:var(--accent);color:var(--on-accent);padding:0 3px;line-height:14px}
.wd i:empty{background:none}
.wd.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.hoy b,.wch b,.mc.hoy b{}
.wd.hoy span{color:var(--accent);font-weight:600}
.wcols{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-height:440px}
.wcol{border-right:1px solid var(--line);padding:0 6px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol:last-child{border-right:0}
.wch{display:flex;align-items:baseline;gap:6px;padding:10px 4px;border-bottom:1px solid var(--line);margin:0 -6px 2px;padding-left:10px}
.wch span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase}
.wch b{font-size:18px}
.wcol.hoy .wch{box-shadow:inset 0 3px 0 var(--accent)}
.wcol.hoy .wch span{color:var(--accent);font-weight:600}
.chip{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px;padding:7px 8px;color:var(--ink);font:inherit;font-size:13px;min-width:0}
.chip span{font-size:11px;color:var(--muted)}
.chip b{overflow-wrap:anywhere;font-weight:600}
.chip small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addc{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:6px;color:var(--muted);padding:6px;font:inherit}
.addc:hover{border-color:var(--accent);color:var(--ink)}
.dlist.semd{display:none}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.mh{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line)}
.mc{position:relative;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;min-height:92px;padding:6px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;min-width:0}
.mc:nth-child(7n){border-right:0}
.mc b{font-size:14px;font-weight:500}
.mc.out b{color:var(--muted);opacity:.5}
.mc.hoy b{color:var(--accent);font-weight:700}
.mc.on{box-shadow:inset 0 0 0 2px var(--accent)}
.mc .ml{font-size:11px;background:var(--bg);border-left:2px solid var(--accent);border-radius:3px;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mc i{display:none}
@media(max-width:899px){
.side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s;width:260px}
.shell.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
.shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}
.burger{display:grid}
.ghost.burger{display:block}
.deskgap{display:none}
.brand .bm{display:block}
.wstrip{display:grid}
.wcols{display:none}
.dlist.semd{display:block}
.caltb .calt{order:-1;flex-basis:100%;padding:0}
.mc{min-height:52px;align-items:center;padding:6px 2px}
.mc .ml{display:none}
.mc i{display:block;font-style:normal;font-size:10px;font-family:var(--mono);background:var(--accent);color:var(--on-accent);border-radius:7px;min-width:14px;line-height:14px;text-align:center;padding:0 3px}
}
.ctx{border-bottom:1px solid var(--line)}
.ctx>.lrow{border-bottom:0;padding-bottom:6px}
.ctxb{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ctxb p{margin:0;font-size:14px}
.ctxb p b{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.al{color:var(--accent)!important;font-weight:600}
.lrow .tk{font-size:12px;color:var(--muted);width:18px;text-align:center}
.tkb{width:22px;height:22px;flex:none;border:1.5px solid var(--muted);border-radius:6px;background:none;padding:0}
.tkb:hover{border-color:var(--accent);background:var(--accent)}

<div id="splash" aria-hidden="true"><div class="in">
  <svg viewBox="0 0 32 32" fill="none" stroke-width="3.2" stroke-linecap="square"><path class="l1" d="M6 17l7 7" stroke="var(--accent)"/><path class="l2" d="M13 24L26 8" stroke="var(--ink)"/></svg>

</div></div>
<div id="app"></div>
<script>
"use strict";
/* Svar by fuge1618. Todo corre en el navegador: no hay servidor ni base de datos.
   Modo profesional (sin link): biblioteca de formularios y armado del link.
   Modo paciente (link con #k=codigo): responde y envía sus respuestas. */
const JSPDF_URL="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const XLSX_URL="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
const MARK='<svg viewBox="0 0 32 32" fill="none" stroke-width="3.2" stroke-linecap="square" aria-hidden="true"><path d="M6 17l7 7" stroke="var(--accent)"/><path d="M13 24L26 8" stroke="var(--ink)"/></svg>';
const BASE=location.origin+location.pathname;
const API="https://api.fuge1618.com";

/* ---------- estado ---------- */
/* Paletas estándar de fuge1618: fondo, superficie, tinta, tinta suave, línea, acento, texto sobre acento. Mismo acento en claro y oscuro. */
const PALETAS=[["Firma",["#E9E8E4","#F6F5F2","#1A1A19","#63615C","#D0CEC7","#FF8000","#1A1A19"],["#131312","#1D1D1B","#ECEBE6","#9D9B94","#34332F","#FF8000","#1A1A19"]],["Grafito",["#E5E7EA","#F4F5F7","#17191C","#5E636A","#CACDD3","#7088A3","#0F1318"],["#101214","#1A1D20","#E8EAED","#969CA5","#2E3338","#7088A3","#0F1318"]],["Tierra",["#E8E1D0","#F5F0E3","#22201A","#6A6455","#D3C9B3","#8C9E44","#16180B"],["#17160F","#211F16","#EDE8DA","#A29C8A","#39362A","#8C9E44","#16180B"]],["Náutico",["#E7E0D0","#F5F0E4","#14233B","#56627A","#CFC6B1","#D63A2F","#FFFFFF"],["#0D1625","#162236","#EDE7D8","#93A0B8","#27364F","#D63A2F","#FFFFFF"]],["Oliva",["#E2E7D8","#F1F4EA","#1C2118","#5C6654","#C8D0BA","#7BB04A","#10190A"],["#11150E","#1A2016","#E6ECDD","#97A38C","#2D3626","#7BB04A","#10190A"]],["Vino",["#EDE3E2","#F8F1F0","#24161A","#6E5A5E","#DAC8C8","#B32A50","#FFFFFF"],["#190E12","#25161B","#F0E3E4","#AE959A","#3D262D","#B32A50","#FFFFFF"]],["Cielo",["#DAE7F2","#EDF4FA","#18242F","#566777","#BDCFDE","#5B9BE3","#0B1722"],["#0E1720","#17222D","#E3EDF5","#8FA2B3","#283746","#5B9BE3","#0B1722"]],["Hortensia",["#E3E0F2","#F3F1FA","#201C33","#615C7C","#CAC5E2","#9685EA","#120E26"],["#13111E","#1D1A2C","#EAE7F6","#9C97B8","#302C47","#9685EA","#120E26"]],["Durazno",["#F4E2D6","#FBF2EC","#2B1D17","#76605A","#E4CCBD","#F08C6C","#2A130D"],["#1B130F","#271C17","#F4E7DF","#B39C92","#3F2E27","#F08C6C","#2A130D"]],["Menta",["#D8EDE5","#EDF8F3","#14251F","#50695F","#B8D8CC","#45B894","#06201A"],["#0D1814","#15241F","#DFF1EA","#8BA79C","#253A32","#45B894","#06201A"]]];
let MODE="pro",P=null,KEY="",TEMA="auto",PAL="",storageOk=true;
let PRO={lib:[],mail:"",nombre:"",mat:""};
let S={perfil:{nombre:"",nac:"",sexo:""},resp:{},done:{}};
let V={name:"pro"},draft=null,busy="",flash="";
const SEL={},PSEL={};let SEP=true;
const ls={get(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){storageOk=false;return null;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){storageOk=false;}}};
const save=()=>MODE==="pac"?ls.set(KEY,S):ls.set("svar.pro",PRO);

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const all=()=>MODE==="pac"?P.forms:PRO.lib;
const F=id=>all().find(f=>f.id===id);
const opts=(f,it)=>it.o||f.scale||[];
const R=(f,i)=>(S.resp[f.id]||{})[i];
const has=(f,i)=>{const r=R(f,i);return f.items[i].multi?Array.isArray(r)&&r.length>0:Number.isInteger(r);};
const count=f=>f.items.reduce((a,_,i)=>a+(has(f,i)?1:0),0);
const missing=f=>f.items.map((_,i)=>i).filter(i=>!has(f,i));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const fdate=s=>{if(!s)return"";const p=String(s).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s;};
function sync(f){if(count(f)===f.items.length){if(!S.done[f.id])S.done[f.id]=today();}else delete S.done[f.id];}
const LT=k=>String.fromCharCode(65+k);
function letters(f,i){const r=R(f,i);if(!has(f,i))return"";return Array.isArray(r)?r.slice().sort((a,b)=>a-b).map(LT).join(","):LT(r);}
function answerText(f,i){const os=opts(f,f.items[i]),r=R(f,i);if(!has(f,i))return"";
  const one=k=>LT(k)+" · "+(os[k]==null?"":os[k]);
  return Array.isArray(r)?r.slice().sort((a,b)=>a-b).map(one).join("; "):one(r);}
function isDark(){return TEMA==="dark"||(TEMA==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);}
function applyTheme(){const r=document.documentElement;if(TEMA==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",TEMA);
  const p=PALETAS.find(x=>x[0]===PAL)||PALETAS[0],v=(t,ok,cs)=>`--bg:${t[0]};--surface:${t[1]};--ink:${t[2]};--muted:${t[3]};--line:${t[4]};--accent:${t[5]};--on-accent:${t[6]};--ok:${ok};color-scheme:${cs}`;
  const L=v(p[1],"#2C7A4B","light"),D=v(p[2],"#74C391","dark");
  let st=document.getElementById("pal");if(!st){st=document.createElement("style");st.id="pal";document.head.appendChild(st);}
  st.textContent=`:root{${L}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${D}}}:root[data-theme="dark"]{${D}}`;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=(isDark()?p[2]:p[1])[0];}
const MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const profOk=()=>!!(PRO.nombre||"").trim()&&MAIL_RE.test((PRO.mail||"").trim());
const datosOk=()=>{if(P&&P.fix)return true;const p=S.perfil||{};return !!((p.nombre||"").trim()&&p.nac&&(p.sexo||"").trim());};
const quien=()=>P?P.d+(P.m?" · Matrícula "+P.m:""):"";
const sender=()=>P&&P.d?`<section class="sec"><h2>Enviado por</h2><div class="pad"><div style="font-weight:600;font-size:17px">${esc(P.d)}</div>${P.m?`<div class="mono" style="font-size:13px;color:var(--muted)">Matrícula ${esc(P.m)}</div>`:""}<p class="note" style="margin-top:8px">Estos cuestionarios te los envió este profesional y tus respuestas son para él${P.e?": "+esc(P.e):""}.</p></div></section>`:"";
const isSel=id=>SEL[id]!==false;
const chosen=()=>all().filter(f=>count(f)>0&&isSel(f.id));
const picked=()=>PRO.lib.filter(f=>PSEL[f.id]);
const CAN_SHARE_FILES=(()=>{try{return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File(["x"],"x.pdf",{type:"application/pdf"})]}));}catch(e){return false;}})();
const CAN_SHARE=!!navigator.share;
let installEvt=null;
const STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(V.name==="pro")render(false);});
window.addEventListener("appinstalled",()=>{installEvt=null;if(V.name==="pro")render(false);});
const installBox=()=>STANDALONE?"":installEvt?`<section class="sec"><h2>Instalar</h2><div class="pad stack"><p class="note">Queda con su ícono, a pantalla completa, y abre aunque no haya conexión.</p><button class="btn" data-a="install">Instalar Svar en este dispositivo</button></div></section>`
  :IS_IOS?`<section class="sec"><h2>Instalar</h2><div class="pad"><p class="note">En iPhone o iPad: abrí esta página en Safari, tocá Compartir y elegí "Agregar a inicio".</p></div></section>`
  :`<section class="sec"><h2>Instalar</h2><div class="pad"><p class="note">Abrí el menú del navegador y elegí "Instalar app" o "Agregar a la pantalla principal".</p></div></section>`;

/* ---------- link: los formularios viajan comprimidos dentro del link ---------- */
const b64u=u=>{let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
const unb64u=s=>{const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function pipe(u,T){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new T("deflate-raw"))).arrayBuffer());}
async function pack(o){const u=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{return"z"+b64u(await pipe(u,CompressionStream));}catch(e){}}return"j"+b64u(u);}
async function unpack(s){const u=unb64u(s.slice(1)),raw=s[0]==="z"?await pipe(u,DecompressionStream):u;return JSON.parse(new TextDecoder().decode(raw));}
const toWire=f=>({c:f.code,n:f.intro||"",s:f.scale||0,q:f.items.map(it=>{const a=[it.n,it.t];if(it.o||it.multi)a.push(it.o||0);if(it.multi)a.push(1);return a;})});
const fromWire=(w,i)=>{const f={id:"f"+i,code:String(w.c||"Formulario"),intro:String(w.n||""),items:(w.q||[]).map(a=>{const it={n:String(a[0]),t:String(a[1])};if(Array.isArray(a[2]))it.o=a[2].map(String);if(a[3])it.multi=true;return it;})};if(Array.isArray(w.s))f.scale=w.s.map(String);return f;};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)+s.length.toString(36);};

/* ---------- pantallas comunes ---------- */
const brand=sub=>`<div class="brand">${MARK}<div><div class="name">Svar</div><div class="by">by fuge1618</div></div><span class="sp"></span>
  <button class="icon" data-a="go" data-v="config" aria-label="Configuración" title="Configuración"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.6"/><circle cx="9" cy="17" r="2.6"/></svg></button></div>`;
const noStore=()=>storageOk?"":'<div class="msg">Este navegador no deja guardar datos. Si cerrás la página se pierde lo cargado.</div>';

/* ---------- modo profesional ---------- */
/* Todo lo del profesional (pacientes, sesiones, envíos y resultados) vive solo en este dispositivo, en localStorage. */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const normName=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
let DB={pacs:[],ses:[],env:[],res:[],tar:[]},BAD=[],ED=null,AG={files:[],text:""};
function dbSave(){try{localStorage.setItem("svar.db",JSON.stringify({v:2,pacs:DB.pacs,ses:DB.ses,env:DB.env,tar:DB.tar,res:DB.res.map(x=>({p:x.p,n:x.n,a:x.a,pid:x.pid,rev:x.rev||""}))}));return true;}catch(e){return false;}}
async function dbRead(arr){const out=[];for(const x of (Array.isArray(arr)?arr:[])){if(!x||typeof x.p!=="string"||!/^[zj][A-Za-z0-9_-]+$/.test(x.p))continue;
  try{const rec=recordRead(await unpack(x.p));if(rec&&rec.forms.length)out.push({p:x.p,n:String(x.n||"").slice(0,120),a:String(x.a||""),pid:String(x.pid||""),rev:String(x.rev||""),rec});}catch(e){}}return out;}
const pac=id=>DB.pacs.find(p=>p.id===id);
/* Un resultado se asigna a la ficha desde la que salió el link; si no trae ficha, por nombre y nacimiento; si no hay, se crea. */
function attach(x){const r=x.rec;let p=pac(x.pid)||pac(r.pid);
  if(!p){const k=normName(r.perfil.nombre);p=DB.pacs.find(q=>normName(q.nombre)===k&&(!q.nac||!r.perfil.nac||q.nac===r.perfil.nac));}
  if(!p){p={id:"p"+uid(),nombre:r.perfil.nombre||"Sin nombre",nac:r.perfil.nac||"",sexo:r.perfil.sexo||"",tel:"",mail:"",nota:"",activo:true,alta:today()};DB.pacs.push(p);}
  x.pid=p.id;return p;}
function dbAdd(xs){const back={pacs:DB.pacs.slice(),res:DB.res.slice()},who=[];xs.forEach(x=>{if(DB.res.some(y=>y.p===x.p))return;who.push(attach(x));DB.res.push(x);});
  if(who.length&&!dbSave()){DB.pacs=back.pacs;DB.res=back.res;return null;}return who;}
const byName=(a,b)=>a.nombre.localeCompare(b.nombre,"es");
const activos=()=>DB.pacs.filter(p=>p.activo!==false).sort(byName);
const pacRecs=id=>DB.res.filter(x=>x.pid===id).map(x=>x.rec);
/* Un mismo cuestionario puede llegar en dos PDF: si las respuestas son idénticas cuenta una sola vez. */
function sinRepetir(recs){const seen={};return recs.map(r=>Object.assign({},r,{forms:r.forms.filter(f=>{const k=f.code+"|"+JSON.stringify(f.resp);if(seen[k])return false;seen[k]=1;return true;})})).filter(r=>r.forms.length);}
function pacTests(id){const out=[],seen={};DB.res.filter(x=>x.pid===id).forEach(x=>x.rec.forms.forEach(f=>{const k=f.code+"|"+JSON.stringify(f.resp);if(seen[k])return;seen[k]=1;out.push({f,fecha:f.done||x.rec.fecha,rec:x.rec,rev:x.rev});}));
  return out.sort((a,b)=>a.f.code.localeCompare(b.f.code,"es")||String(a.fecha).localeCompare(String(b.fecha)));}
const sexSel=(id,v)=>`<select id="${id}"><option value="">Elegir…</option>${["Femenino","Masculino"].map(o=>`<option${String(v||"")[0]&&o[0].toLowerCase()===String(v)[0].toLowerCase()?" selected":""}>${o}</option>`).join("")}</select>`;
const waNum=t=>{let d=String(t||"").replace(/\D/g,"").replace(/^0+/,"");if(!d)return"";return d.startsWith("54")?d:"549"+d;};
const sendMsg=(p,L)=>"Hola "+String(p.nombre||"").split(" ")[0]+", te mando los cuestionarios para completar desde el celular: "+L;
/* Qué cuestionarios de un envío todavía no volvieron completos. */
function envFalta(e){const got={};DB.res.forEach(x=>{if(x.pid!==e.pid)return;x.rec.forms.forEach(f=>{if(rCount(f)<f.items.length)return;if(x.rec.env===e.id||(!x.rec.env&&String(f.done||x.rec.fecha)>=e.fecha))got[f.code]=1;});});return e.codes.filter(c=>!got[c]);}
const pendientes=()=>DB.env.map(e=>({e,p:pac(e.pid),falta:envFalta(e)})).filter(o=>o.p&&o.falta.length);
const sesSort=(a,b)=>(a.f+(a.h||"")).localeCompare(b.f+(b.h||""));
const dlabel=f=>{try{return new Date(f+"T12:00:00").toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"numeric"});}catch(e){return fdate(f);}};
const dias=f=>Math.max(0,Math.round((new Date(today()+"T12:00:00")-new Date(f+"T12:00:00"))/864e5));
const hace=f=>{const d=dias(f);return d===0?"hoy":d===1?"ayer":"hace "+d+" días";};
const bar=(t,back,cnt)=>`<header class="bar">${back?`<button class="ghost" data-a="go" data-v="${back[0]}" data-k="${esc(back[2]||"")}">‹ ${back[1]}</button>`:'<button class="ghost burger" data-a="nav" aria-label="Abrir menú">☰ Menú</button><span class="ghost deskgap"></span>'}<div class="t">${t}</div><div class="cnt mono">${cnt==null?"":cnt}</div></header>`;
const rtag=t=>`<span class="r mono" style="margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none">${t}</span>`;
const fl=role=>flash?`<div class="msg" role="${role||"status"}">${flash}</div>`:"";
const loadBtn=(pri,label)=>`<label class="btn ${pri?"pri":"soft"} filebtn" for="a-files">${label||"Cargar resultados (PDF)"}</label><input type="file" id="a-files" accept="application/pdf,.pdf" multiple hidden>`;
const badBox=()=>BAD.length?`<div class="msg" role="alert">No pude leer ${BAD.length===1?"este archivo":"estos archivos"}: ${BAD.map(esc).join(", ")}. Tiene que ser el PDF original que generó Svar, sin imprimir ni volver a guardar.</div>`:"";
const sesRow=(s,d,nom)=>`<button class="lrow" data-a="go" data-v="sesion" data-s="${esc(s.id)}"><span class="mono h">${d?esc(dlabel(s.f))+" · ":""}${esc(s.h||"--:--")}</span><span class="g">${nom?esc(pac(s.pid).nombre):esc(s.nota||"Sesión")}${nom&&s.nota?`<small>${esc(s.nota)}</small>`:""}</span><span class="ch">›</span></button>`;
const linkBox=p=>{const L=V.link||"";if(!L)return"";const m=p?encodeURIComponent(sendMsg(p,L)):"";
  return (V.short?`<input type="text" id="p-link" readonly aria-label="Link" class="mono" value="${esc(L)}">`:`<textarea id="p-link" readonly aria-label="Link" style="min-height:96px;word-break:break-all">${esc(L)}</textarea>`)+
  (p?`<div class="two"><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${waNum(p.tel)}?text=${m}">Enviar por WhatsApp</a>${p.mail?`<a class="btn" href="mailto:${esc(p.mail)}?subject=${encodeURIComponent("Cuestionarios para completar")}&body=${m}">Enviar por mail</a>`:'<button class="btn soft" disabled>Sin mail en la ficha</button>'}</div>${p.tel?"":'<p class="note">La ficha no tiene teléfono: WhatsApp te va a pedir que elijas el contacto.</p>'}`:"")+
  `<div class="two"><button class="btn soft" data-a="cplink">Copiar link</button>${CAN_SHARE?'<button class="btn soft" data-a="shlink">Compartir</button>':'<button class="btn soft" data-a="openlink">Probar acá</button>'}</div>`;};
const libPick=()=>`<div class="opts" role="group" aria-label="Formularios para enviar">${PRO.lib.map(f=>`<button class="opt${PSEL[f.id]?" on":""}" role="checkbox" aria-checked="${!!PSEL[f.id]}" data-a="psel" data-f="${esc(f.id)}"><span class="mk"></span><span class="mono" style="font-weight:600;flex:1">${esc(f.code)}</span><span class="mono" style="font-size:12px;color:var(--muted)">${f.items.length} preg.${f.key?" · clave":""}</span></button>`).join("")}</div>`;

const cut=(t,n)=>{t=String(t||"").trim();return t.length>n?t.slice(0,n).trim()+"…":t;};
const sinRev=id=>DB.res.filter(x=>x.pid===id&&!x.rev);
const codesOf=xs=>[...new Set(xs.flatMap(x=>x.rec.forms.map(f=>f.code)))];
function vPanel(){
  const t=today(),hoy=sesOf(t),pen=pendientes(),rev=activos().map(p=>({p,xs:sinRev(p.id)})).filter(o=>o.xs.length),tar=DB.tar.filter(x=>!x.done).sort((a,b)=>String(a.f||"9").localeCompare(String(b.f||"9")));
  const ctx=s=>{const p=pac(s.pid),k=s.f+(s.h||""),prev=DB.ses.filter(x=>x.pid===p.id&&x.id!==s.id&&(x.f+(x.h||""))<k).sort(sesSort).pop(),nr=sinRev(p.id),pe=DB.env.filter(e=>e.pid===p.id&&envFalta(e).length);

function edBuild(){const sc=lines(ED.scale),items=[],seen={},P={};
  if(!ED.code.trim())return{err:"Falta el nombre corto del formulario."};
  if(!ED.items.length)return{err:"Agregá al menos una pregunta."};
  for(const it of ED.items){const o=lines(it.o),lab="La pregunta "+(it.n||"sin número");
    if(!it.n)return{err:"Hay una pregunta sin número."};if(seen[it.n])return{err:"El número "+it.n+" está repetido."};seen[it.n]=1;
    if(!it.t.trim())return{err:lab+" no tiene texto."};
    if(o.length===1)return{err:lab+" tiene una sola opción propia."};
    const os=o.length?o:sc;if(os.length<2)return{err:lab+" necesita al menos dos opciones, propias o comunes."};
    const x={n:it.n,t:it.t.trim()};if(o.length)x.o=o;if(it.multi)x.multi=true;items.push(x);
    if(it.p.trim()){const p=nums(it.p).map(Number);if(p.some(q=>!Number.isFinite(q)))return{err:lab+": los puntos tienen que ser números separados por coma."};
      if(it.multi)return{err:lab+" permite varias respuestas y no puede llevar puntos."};
      if(p.length!==os.length)return{err:lab+" tiene "+os.length+" opciones y "+p.length+" puntos."};P[it.n]=p;}}
  const f={id:ED.id||"c"+uid(),code:ED.code.trim().slice(0,24),intro:ED.intro.trim(),items};if(sc.length>1)f.scale=sc;
  const ks=Object.keys(P),sl=lines(ED.subs);

    const c=keyCheck({src:ED.src,ref:ED.ref,rules:Object.keys(g).map(k=>({n:g[k],p:JSON.parse(k)})),subs},f);if(c.err)return{err:c.err};f.key=c.key;}
  else if(sl.length)return{err:"Cargaste subescalas pero ninguna pregunta tiene puntos."};
  return{f};}

const PROMPT=`Vas a transcribir un cuestionario de opción múltiple (de los que se completan tildando una respuesta) para mostrarlo en una app.
Reglas:
- Copiá cada pregunta y cada opción tal cual están escritas. No corrijas, no traduzcas, no resumas, no agregues ni quites nada.
- No respondas las preguntas, no las interpretes y no agregues comentarios.
- Ignorá campos de datos personales (nombre, fecha, sexo), ejemplos de cómo completar y marcas hechas a mano.
- Si todas las preguntas comparten las mismas opciones (por ejemplo columnas de una tabla), ponelas una sola vez en "scale" y no pongas "o" en las preguntas.
- Si las preguntas tienen opciones distintas, "scale" es null y cada pregunta lleva su lista "o".
- "multi": true solo si la consigna dice que se puede elegir más de una opción.
- "n" es el número de la pregunta como figura en el original. "code" es el título o sigla del cuestionario si figura; si no, "Formulario".
- "intro" es la consigna general si figura; si no, "".
- Solo si además te paso la clave de puntuación del cuestionario, agregá "key" con esta forma: {"src":"autores y año","ref":"valores de referencia publicados o \"\"","rules":[{"n":["1","2"],"p":[1,1,0,0]}],"subs":[{"name":"...","n":["1"]}]}, donde "p" son los puntos de cada opción en orden y las preguntas que no puntúan no figuran. No inventes una clave de memoria: si no te la paso, no pongas "key".
Respondé únicamente con JSON, sin texto antes ni después, con esta forma:
{"code":"AB-1","intro":"...","scale":["...","..."],"items":[{"n":"1","t":"..."},{"n":"2","t":"...","o":["...","..."],"multi":false}]}`;

async function filePart(file){
  if(/^image\//.test(file.type)){const bmp=await createImageBitmap(file),k=Math.min(1,1800/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return{mime:"image/jpeg",data:c.toDataURL("image/jpeg",.85).split(",")[1]};}
  const u=new Uint8Array(await file.arrayBuffer());let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return{mime:"application/pdf",data:btoa(s)};}
async function importFile(file){let nf=0,np=0,nr=0,full=false;
  try{const o=JSON.parse(await file.text()),arr=Array.isArray(o)?o:(o&&o.forms)||[];const fs=arr.map(x=>normalize([x])).filter(Boolean);nf=fs.length;if(nf){addToLib(fs);save();}
    const d=o&&o.db,back=JSON.stringify({pacs:DB.pacs,ses:DB.ses,env:DB.env,tar:DB.tar}),backRes=DB.res.slice();
    if(d&&typeof d==="object"){const merge=(k,ok)=>(Array.isArray(d[k])?d[k]:[]).forEach(x=>{if(x&&x.id&&ok(x)&&!DB[k].some(y=>y.id===x.id)){DB[k].push(x);if(k==="pacs")np++;}});
      merge("pacs",x=>typeof x.nombre==="string");merge("ses",x=>typeof x.f==="string");merge("env",x=>Array.isArray(x.codes));merge("tar",x=>typeof x.t==="string");}
    const xs=await dbRead((d&&d.res)||(o&&o.pacientes)||[]);xs.forEach(x=>{if(DB.res.some(y=>y.p===x.p))return;const n0=DB.pacs.length;attach(x);if(DB.pacs.length>n0)np++;DB.res.push(x);nr++;});
    if((np||nr||d)&&!dbSave()){const b=JSON.parse(back);DB.pacs=b.pacs;DB.ses=b.ses;DB.env=b.env;DB.tar=b.tar;DB.res=backRes;full=true;}}catch(err){}
  if(full)return"No queda espacio en este navegador para guardar ese respaldo.";
  if(!nf&&!np&&!nr)return"Ese archivo no trae nada nuevo, o no es de Svar.";
  return"Se importó: "+[nf&&(nf===1?"1 formulario":nf+" formularios"),np&&(np===1?"1 paciente":np+" pacientes"),nr&&(nr===1?"1 resultado":nr+" resultados")].filter(Boolean).join(", ")+".";}
