<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E9E8E4">
<title>Svar</title>
<meta name="description" content="Cuestionarios, una pregunta a la vez. by fuge1618">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Svar">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-width='3.2' stroke-linecap='square'%3E%3Crect width='32' height='32' rx='7' fill='%23E9E8E4'/%3E%3Cpath d='M6 17l7 7' stroke='%23FF8000'/%3E%3Cpath d='M13 24L26 8' stroke='%231A1A19'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de celular (max 560px); ficha técnica gris, tinta casi negra, un solo acento papaya. */
:root{
  --bg:#E9E8E4; --surface:#F6F5F2; --ink:#1A1A19; --muted:#63615C; --line:#D0CEC7;
  --accent:#FF8000; --on-accent:#1A1A19; --ok:#2C7A4B;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1D1D1B; --ink:#ECEBE6; --muted:#9D9B94; --line:#34332F;
    --accent:#FF8000; --on-accent:#1A1A19; --ok:#74C391; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1D1D1B; --ink:#ECEBE6; --muted:#9D9B94; --line:#34332F;
  --accent:#FF8000; --on-accent:#1A1A19; --ok:#74C391; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px}
main{flex:1;display:flex;flex-direction:column;gap:20px;padding:8px 0 28px}

/* marca */
.brand{display:flex;align-items:center;gap:12px;padding:22px 0 6px}
.brand svg{width:34px;height:34px;flex:none}
.brand .name{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand .by{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.brand .sp{flex:1}
.icon{border:1px solid var(--line);background:transparent;border-radius:8px;width:40px;height:40px;display:grid;place-items:center}
.icon svg{width:18px;height:18px}
.lema{color:var(--muted);margin:0}

/* barra superior de pantallas internas */
.bar{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.bar .t{font-weight:600;flex:1;text-align:center}
.bar .cnt{color:var(--muted);font-size:13px;min-width:72px;text-align:right}
.ghost{border:0;background:transparent;padding:8px 4px;color:var(--muted);min-width:72px;text-align:left}

/* secciones */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.sec>h2,.sec>summary{margin:0;padding:10px 14px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sec>h2::before,.sec>summary::before{content:"";width:14px;height:3px;background:var(--accent);flex:none}
.sec>summary{cursor:pointer;list-style:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .r{margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
details.sec:not([open])>summary{border-bottom:0}
.pad{padding:14px}

/* lista de cuestionarios */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:64px}
.row:last-child{border-bottom:0}
.row .code{font-family:var(--mono);font-weight:600;font-size:17px;min-width:92px}
.row .meta{flex:1;color:var(--muted);font-size:13px}
.row .mini{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.row .mini i{display:block;height:100%;background:var(--accent)}
.pill{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.go{border-color:var(--accent);color:var(--ink)}
.chev{color:var(--muted)}

/* botones */
.btn{border:1px solid var(--ink);background:transparent;border-radius:10px;padding:13px 16px;font-weight:500;min-height:48px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.soft{border-color:var(--line)}
.btn.danger{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.btn.seg{font-size:14px;padding:10px 8px}
.btn.seg.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{color:var(--muted);font-size:13px;margin:0}

/* pregunta */
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qhead{min-height:9.2em;display:flex;flex-direction:column;gap:10px;justify-content:flex-start;padding-top:10px}
.qn{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.qn::before{content:"";width:18px;height:3px;background:var(--accent)}
.qt{font-size:21px;line-height:1.3;font-weight:500;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:13px;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt .mk{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;flex:none;display:grid;place-items:center}
.opt[role=checkbox] .mk{border-radius:5px}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;width:1ch}
.sec.test>summary{font-size:12px}
.sec.test>summary .tcode{font-size:20px;letter-spacing:0;text-transform:none}
.sub{margin:0;padding:12px 14px 6px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 14px 10px}
.cell{display:flex;align-items:baseline;justify-content:space-between;gap:4px;border:1px solid var(--line);border-radius:7px;background:transparent;padding:7px 8px;font-family:var(--mono);min-height:38px}
.cell span{font-size:12px;color:var(--muted)}
.cell b{font-size:15px}
.cell.none b{color:var(--muted);font-weight:400}
.legend{padding:2px 14px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line)}
.legend b{display:inline-block;width:1.6ch}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.on .mk{border-color:var(--accent);background:var(--accent)}
.opt.on .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.opt[role=checkbox].on .mk::after{border-radius:2px}
.nav{position:sticky;bottom:0;background:var(--bg);display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:10px 0 16px;border-top:1px solid var(--line)}

/* tablero */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);text-align:left;text-transform:uppercase;letter-spacing:.06em}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);color:var(--muted);width:1%;white-space:nowrap;padding-right:4px}
.ans{display:block;margin-top:3px;font-weight:600}
.ans.none{color:var(--muted);font-weight:400}
tr.tap{cursor:pointer}
dl.datos{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.datos dt{color:var(--muted)}
dl.datos dd{margin:0}

/* formularios */
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px}
.field{margin:0}
.msg{border-left:3px solid var(--accent);padding:10px 12px;background:var(--surface);font-size:14px;border-radius:0 8px 8px 0}
.big{font-size:24px;font-weight:600;margin:18px 0 0;line-height:1.2;text-wrap:balance}
textarea{width:100%;min-height:180px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px}

/* inicio animado */
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;animation:out .35s 1.25s forwards}
#splash .in{display:flex;flex-direction:column;align-items:center;gap:14px}
#splash svg{width:84px;height:84px}
#splash .l1{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .3s .15s forwards}
#splash .l2{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .45s .4s forwards}
#splash .w{opacity:0;animation:up .4s .75s forwards;text-align:center}
#splash .w b{font-size:28px;font-weight:600;display:block;line-height:1}
#splash .w span{font-family:var(--mono);font-size:11px;color:var(--muted)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{display:none}.prog i{transition:none}}
.filebtn{display:grid;place-items:center;cursor:pointer;margin:0;font-size:16px;color:var(--ink)}
a.btn{display:block;text-decoration:none;color:var(--ink)}
a.btn.pri{color:var(--on-accent)}
input[type=email]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="in">
  <svg viewBox="0 0 32 32" fill="none" stroke-width="3.2" stroke-linecap="square"><path class="l1" d="M6 17l7 7" stroke="var(--accent)"/><path class="l2" d="M13 24L26 8" stroke="var(--ink)"/></svg>
  <div class="w"><b>Svar</b><span>by fuge1618</span></div>
</div></div>
<div id="app"></div>
<script>
"use strict";
/* Svar by fuge1618. Todo corre en el navegador: no hay servidor ni base de datos.
   Modo profesional (sin link): biblioteca de formularios y armado del link.
   Modo paciente (link con #k=codigo): responde y envía sus respuestas. */
const JSPDF_URL="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const MARK='<svg viewBox="0 0 32 32" fill="none" stroke-width="3.2" stroke-linecap="square" aria-hidden="true"><path d="M6 17l7 7" stroke="var(--accent)"/><path d="M13 24L26 8" stroke="var(--ink)"/></svg>';
const BASE=location.origin+location.pathname;
const API="https://api.fuge1618.com";

/* ---------- estado ---------- */
let MODE="pro",P=null,KEY="",TEMA="auto",storageOk=true;
let PRO={lib:[],mail:"",nombre:"",mat:""};
let S={perfil:{nombre:"",nac:"",sexo:""},resp:{},done:{}};
let V={name:"pro"},draft=null,busy="",flash="";
const SEL={},PSEL={};let SEP=true;
const ls={get(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){storageOk=false;return null;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){storageOk=false;}}};
const save=()=>MODE==="pac"?ls.set(KEY,S):ls.set("svar.pro",PRO);

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const all=()=>MODE==="pac"?P.forms:PRO.lib;
const F=id=>all().find(f=>f.id===id);
const opts=(f,it)=>it.o||f.scale||[];
const R=(f,i)=>(S.resp[f.id]||{})[i];
const has=(f,i)=>{const r=R(f,i);return f.items[i].multi?Array.isArray(r)&&r.length>0:Number.isInteger(r);};
const count=f=>f.items.reduce((a,_,i)=>a+(has(f,i)?1:0),0);
const missing=f=>f.items.map((_,i)=>i).filter(i=>!has(f,i));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const fdate=s=>{if(!s)return"";const p=String(s).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s;};
function sync(f){if(count(f)===f.items.length){if(!S.done[f.id])S.done[f.id]=today();}else delete S.done[f.id];}
const LT=k=>String.fromCharCode(65+k);
function letters(f,i){const r=R(f,i);if(!has(f,i))return"";return Array.isArray(r)?r.slice().sort((a,b)=>a-b).map(LT).join(","):LT(r);}
function answerText(f,i){const os=opts(f,f.items[i]),r=R(f,i);if(!has(f,i))return"";
  const one=k=>LT(k)+" · "+(os[k]==null?"":os[k]);
  return Array.isArray(r)?r.slice().sort((a,b)=>a-b).map(one).join("; "):one(r);}
function applyTheme(){const r=document.documentElement;if(TEMA==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",TEMA);}
const MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const profOk=()=>!!(PRO.nombre||"").trim()&&MAIL_RE.test((PRO.mail||"").trim());
const datosOk=()=>{const p=S.perfil||{};return !!((p.nombre||"").trim()&&p.nac&&(p.sexo||"").trim());};
const quien=()=>P?P.d+(P.m?" · Matrícula "+P.m:""):"";
const sender=()=>P&&P.d?`<section class="sec"><h2>Enviado por</h2><div class="pad"><div style="font-weight:600;font-size:17px">${esc(P.d)}</div>${P.m?`<div class="mono" style="font-size:13px;color:var(--muted)">Matrícula ${esc(P.m)}</div>`:""}<p class="note" style="margin-top:8px">Estos cuestionarios te los envió este profesional y tus respuestas son para él${P.e?": "+esc(P.e):""}.</p></div></section>`:"";
const isSel=id=>SEL[id]!==false;
const chosen=()=>all().filter(f=>count(f)>0&&isSel(f.id));
const picked=()=>PRO.lib.filter(f=>PSEL[f.id]);
const CAN_SHARE_FILES=(()=>{try{return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File(["x"],"x.pdf",{type:"application/pdf"})]}));}catch(e){return false;}})();
const CAN_SHARE=!!navigator.share;
let installEvt=null;
const STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(V.name==="pro")render(false);});
window.addEventListener("appinstalled",()=>{installEvt=null;if(V.name==="pro")render(false);});
const installBox=()=>STANDALONE?"":installEvt?`<section class="sec"><h2>Instalar</h2><div class="pad stack"><p class="note">Queda con su ícono, a pantalla completa, y abre aunque no haya conexión.</p><button class="btn" data-a="install">Instalar Svar en este dispositivo</button></div></section>`
  :IS_IOS?`<section class="sec"><h2>Instalar</h2><div class="pad"><p class="note">En iPhone o iPad: abrí esta página en Safari, tocá Compartir y elegí "Agregar a inicio".</p></div></section>`
  :`<section class="sec"><h2>Instalar</h2><div class="pad"><p class="note">Abrí el menú del navegador y elegí "Instalar app" o "Agregar a la pantalla principal".</p></div></section>`;

/* ---------- link: los formularios viajan comprimidos dentro del link ---------- */
const b64u=u=>{let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
const unb64u=s=>{const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function pipe(u,T){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new T("deflate-raw"))).arrayBuffer());}
async function pack(o){const u=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{return"z"+b64u(await pipe(u,CompressionStream));}catch(e){}}return"j"+b64u(u);}
async function unpack(s){const u=unb64u(s.slice(1)),raw=s[0]==="z"?await pipe(u,DecompressionStream):u;return JSON.parse(new TextDecoder().decode(raw));}
const toWire=f=>({c:f.code,n:f.intro||"",s:f.scale||0,q:f.items.map(it=>{const a=[it.n,it.t];if(it.o||it.multi)a.push(it.o||0);if(it.multi)a.push(1);return a;})});
const fromWire=(w,i)=>{const f={id:"f"+i,code:String(w.c||"Formulario"),intro:String(w.n||""),items:(w.q||[]).map(a=>{const it={n:String(a[0]),t:String(a[1])};if(Array.isArray(a[2]))it.o=a[2].map(String);if(a[3])it.multi=true;return it;})};if(Array.isArray(w.s))f.scale=w.s.map(String);return f;};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)+s.length.toString(36);};

/* ---------- pantallas comunes ---------- */
const brand=sub=>`<div class="brand">${MARK}<div><div class="name">Svar</div><div class="by">by fuge1618</div></div><span class="sp"></span>
  <button class="icon" data-a="tema" aria-label="Cambiar entre modo claro y oscuro" title="Claro / oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg></button></div>`;
const noStore=()=>storageOk?"":'<div class="msg">Este navegador no deja guardar datos. Si cerrás la página se pierde lo cargado.</div>';

/* ---------- modo profesional ---------- */
function vPro(){
  const lib=PRO.lib,n=picked().length,L=V.link||"";
  return brand()+`<main>
    <p class="lema">Modo profesional. Elegí los cuestionarios, creá un link y mandáselo a tu paciente.</p>
    ${noStore()}
    <section class="sec"><h2>Biblioteca <span class="r mono" style="margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:0">${lib.length} ${lib.length===1?"formulario":"formularios"}</span></h2><div class="pad stack">
      ${lib.length?`<div class="opts" role="group" aria-label="Cuestionarios para enviar">${lib.map(f=>`<button class="opt${PSEL[f.id]?" on":""}" role="checkbox" aria-checked="${!!PSEL[f.id]}" data-a="psel" data-f="${esc(f.id)}"><span class="mk"></span><span class="mono" style="font-weight:600;flex:1">${esc(f.code)}</span><span class="mono" style="font-size:12px;color:var(--muted)">${f.items.length} preg.</span></button>`).join("")}</div>`
        :'<div class="msg">Todavía no hay formularios. Agregá uno o importá una biblioteca.</div>'}
      <div class="two"><button class="btn soft" data-a="go" data-v="agregar">Agregar formulario</button><label class="btn soft filebtn" for="p-import">Importar biblioteca</label></div>
      <input type="file" id="p-import" accept="application/json,.json" hidden>
      ${lib.length?`<div class="two"><button class="btn soft" data-a="exportlib">Exportar biblioteca</button>${V.confirm?`<button class="btn" data-a="rm2">Sí, quitar ${n}</button>`:`<button class="btn danger" data-a="rm" ${n?"":"disabled"}>Quitar marcados</button>`}</div>`:""}
    </div></section>
    <section class="sec"><h2>Link para el paciente</h2><div class="pad stack">
      <dl class="datos"><dt>Profesional</dt><dd>${esc(PRO.nombre)}</dd><dt>Mail</dt><dd>${esc(PRO.mail)}</dd>${PRO.mat?`<dt>Matrícula</dt><dd>${esc(PRO.mat)}</dd>`:""}</dl>
      <p class="note">El paciente va a ver estos datos como remitente, y las respuestas van a este mail.</p>
      <button class="btn soft" data-a="go" data-v="perfil">Editar mi perfil</button>

  async cplink(){const ok=await copyText(V.link);flash=ok?"Link copiado. Pegalo en el chat con tu paciente.":"No se pudo copiar solo. Mantené apretado el link de arriba y copialo.";render(false);},
  async shlink(){try{await navigator.share({title:"Cuestionarios",text:"Te mando los cuestionarios para completar desde el celular:",url:V.link});}catch(e){}},
  openlink(){location.href=V.link;},
  rm(){V.confirm=true;render(false);},
  rm2(){PRO.lib=PRO.lib.filter(f=>!PSEL[f.id]);Object.keys(PSEL).forEach(k=>delete PSEL[k]);V.confirm=false;V.link="";save();render(false);},
  async exportlib(){const r=await saveFile("biblioteca-svar.json",new Blob([JSON.stringify({svar:1,forms:PRO.lib},null,1)],{type:"application/json"}));flash=r==="saved"?"Biblioteca descargada. Guardala como respaldo o pasala a otro dispositivo.":"No se pudo descargar.";render(false);},
  async cpprompt(){const ok=await copyText(PROMPT);V.showp=!ok;flash=ok?"Indicaciones copiadas. Ahora pegalas en tu IA junto con el formulario.":"No se pudo copiar solo. Copiá el texto que aparece en el paso 1.";render(false);},
  parse(){const t=document.getElementById("f-json").value,o=looseJson(t),f=o?normalize([o]):null;
    if(!f){flash=t.trim()?"No pude leer eso como formulario. Pegá la respuesta completa de la IA, desde la primera llave { hasta la última }.":"Pegá primero la respuesta de tu IA.";render(false);return;}
    draft=f;go("agregar");},
  discard(){draft=null;go("agregar");},
  keep(){draft.code=(document.getElementById("f-code").value.trim()||"Formulario").slice(0,24);addToLib([draft]);PSEL[draft.id]=true;draft=null;save();go("pro");},

  retry(){location.reload();}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const fn=ACT[el.dataset.a];if(fn)fn(el);});
document.addEventListener("change",async e=>{if(e.target.id!=="p-import")return;const file=e.target.files&&e.target.files[0];if(!file)return;
  let n=0;try{const o=JSON.parse(await file.text()),arr=Array.isArray(o)?o:(o&&o.forms)||[];const fs=arr.map(x=>normalize([x])).filter(Boolean);n=fs.length;addToLib(fs);save();}catch(err){n=0;}
  flash=n?"Se "+(n===1?"importó 1 formulario.":"importaron "+n+" formularios."):"Ese archivo no es una biblioteca de Svar.";render(false);});

/* ---------- biblioteca ---------- */
function looseJson(t){t=String(t||"").trim();const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)t=fence[1].trim();
  try{return JSON.parse(t);}catch(e){}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}return null;}
function normalize(parts){
  const first=parts[0]||{},scale=Array.isArray(first.scale)&&first.scale.length>1?first.scale.map(String):null,items=[];
  parts.forEach(p=>(Array.isArray(p&&p.items)?p.items:[]).forEach(it=>{if(!it||typeof it.t!=="string"||!it.t.trim())return;
    const o=Array.isArray(it.o)&&it.o.length>1?it.o.map(String):null;if(!o&&!scale)return;
    const x={n:String(it.n==null?items.length+1:it.n),t:it.t.trim()};if(o)x.o=o;if(it.multi===true)x.multi=true;items.push(x);}));
  if(!items.length)return null;
  const f={id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:String(first.code||"Formulario").slice(0,24),intro:String(first.intro||""),items};if(scale)f.scale=scale;return f;
}
function addToLib(fs){fs.forEach(f=>{const i=PRO.lib.findIndex(g=>g.code===f.code);if(i>=0){f.id=PRO.lib[i].id;PRO.lib[i]=f;}else PRO.lib.push(f);});}

/* ---------- salida: mail, texto y PDF ---------- */
function mailHref(fs){const p=S.perfil,L=[(P.d?"Para: "+quien():""),"Nombre: "+(p.nombre||"-"),"Nacimiento: "+(fdate(p.nac)||"-")+"   Sexo: "+(p.sexo||"-"),"Fecha: "+fdate(today()),""];
  fs.forEach(f=>{L.push(f.code+" ("+count(f)+" de "+f.items.length+")");
    for(let i=0;i<f.items.length;i+=10)L.push(f.items.slice(i,i+10).map((it,j)=>it.n+(letters(f,i+j)||"_")).join("  "));
    if(f.scale)L.push(f.scale.map((o,k)=>LT(k)+"="+o).join(", "));L.push("");});
  L.push("Resumen de pregunta y letra, sin puntaje ni interpretación. Enviado con Svar by fuge1618.");
  return "mailto:"+encodeURIComponent(P.e)+"?subject="+encodeURIComponent("Respuestas "+fs.map(f=>f.code).join(", ")+(p.nombre?" - "+p.nombre:""))+"&body="+encodeURIComponent(L.join("\r\n"));}
function makeText(fs){const p=S.perfil,L=["Respuestas de cuestionarios"+(P&&P.d?" para "+quien():""),"Nombre: "+(p.nombre||"-"),"Fecha de nacimiento: "+(fdate(p.nac)||"-"),"Sexo: "+(p.sexo||"-"),"Generado: "+fdate(today()),""];
  fs.forEach(f=>{L.push("== "+f.code+" ("+count(f)+" de "+f.items.length+(S.done[f.id]?", completado "+fdate(S.done[f.id]):"")+") ==");
    L.push("Resumen (pregunta-letra):");for(let i=0;i<f.items.length;i+=10)L.push("  "+f.items.slice(i,i+10).map((it,j)=>it.n+"-"+(letters(f,i+j)||"_")).join("  "));
    if(f.scale)L.push("Letras: "+f.scale.map((o,k)=>LT(k)+" = "+o).join(" | "));else L.push("Letras: posición de la opción elegida en cada pregunta (A = primera).");
    L.push("Detalle:");f.items.forEach((it,i)=>L.push(it.n+". "+it.t+"\n   > "+(answerText(f,i)||"Sin responder")));L.push("");});
  return L.join("\n");}
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector('script[data-src="'+src+'"]'))return ok();const s=document.createElement("script");s.src=src;s.dataset.src=src;s.onload=()=>ok();s.onerror=()=>{s.remove();no(new Error("script"));};document.head.appendChild(s);});}
function pdfName(fs){return fs.map(f=>f.code).join(" ").replace(/[^\w\s-]/g,"").slice(0,80)+(S.perfil.nombre?" - "+S.perfil.nombre.replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g,""):"")+" - "+today()+".pdf";}
async function exportPdf(mode){
  const fs=chosen();if(!fs.length)return;busy=mode;flash="";render(false);
  try{const groups=SEP?fs.map(f=>[f]):[fs],files=[];
    for(const g of groups)files.push({name:pdfName(g),blob:await makePdf(g)});
    if(mode==="share"){
      try{await navigator.share({files:files.map(x=>new File([x.blob],x.name,{type:"application/pdf"})),title:"Respuestas "+fs.map(f=>f.code).join(", ")});flash="Listo, lo pasaste a la app que elegiste.";}
      catch(e){flash=e&&e.name==="AbortError"?"No se compartió. Podés intentarlo de nuevo.":"Este teléfono no dejó compartir. Usá Descargar PDF y mandalo desde tus archivos.";}
    }else{let ok=0;for(const x of files){if(await saveFile(x.name,x.blob)!=="saved")break;ok++;if(files.length>1)await new Promise(r=>setTimeout(r,350));}
      flash=ok===files.length?(ok===1?"PDF listo. Buscalo en tus descargas.":ok+" PDF listos, uno por test. Buscalos en tus descargas."):"No se pudo descargar. Usá Copiar como texto.";}
  }catch(e){flash="No se pudo armar el PDF. Revisá la conexión e intentá de nuevo, o usá Copiar como texto.";}
  busy="";render(false);
}
async function makePdf(fs){
  await loadScript(JSPDF_URL);const d=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
  const W=595.28,H=841.89,M=44,wN=30,wA=170,wT=W-2*M-wN-wA-16;let y=M,cur="";const pageCode={};
  const lat=s=>String(s==null?"":s).replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,"-").replace(/…/g,"...").replace(/​/g,"").replace(/[^\x00-\xFF]/g,"?");
  const need=h=>{if(y+h>H-M-22){d.addPage();y=M;pageCode[d.getNumberOfPages()]=cur;}};
  const sub=t=>{need(44);d.setDrawColor(255,128,0);d.setLineWidth(2.5);d.line(M,y-3,M+14,y-3);d.setFont("helvetica","bold");d.setFontSize(9);d.setTextColor(20);d.text(t.toUpperCase(),M+20,y);y+=12;};
  const p=S.perfil;
  fs.forEach((f,fi)=>{
    if(fi>0)d.addPage();y=M;cur=f.code;pageCode[d.getNumberOfPages()]=cur;
    d.setFont("helvetica","bold");d.setFontSize(34);d.setTextColor(20);d.text(lat(f.code),M,y+26);
    d.setFontSize(11);d.text(lat(p.nombre||"Sin nombre"),W-M,y+4,{align:"right"});
    d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(100);
    d.text(lat("Nacimiento: "+(fdate(p.nac)||"-")+"   Sexo: "+(p.sexo||"-")),W-M,y+17,{align:"right"});
    d.text(S.done[f.id]?"Completado el "+fdate(S.done[f.id])+"  ("+f.items.length+" preguntas)":"Incompleto: "+count(f)+" de "+f.items.length+" respondidas  ("+fdate(today())+")",W-M,y+29,{align:"right"});
    if(P&&P.d){d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(100);d.text(lat("Solicitado por "+quien()),M,y+42);y+=14;}
    y+=40;d.setDrawColor(190);d.setLineWidth(.6);d.line(M,y,W-M,y);d.setDrawColor(255,128,0);d.setLineWidth(2.5);d.line(M,y,M+40,y);y+=26;
    sub("Resumen: pregunta y letra");
    const cols=10,cw=(W-2*M)/cols,rh=18;
    for(let i=0;i<f.items.length;i+=cols){need(rh);
      for(let c=0;c<cols&&i+c<f.items.length;c++){const x=M+c*cw,l=letters(f,i+c);
        d.setDrawColor(205);d.setLineWidth(.5);d.rect(x,y,cw,rh);
        d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(110);d.text(lat(f.items[i+c].n),x+5,y+12);
        if(l){d.setFont("helvetica","bold");d.setFontSize(10.5);d.setTextColor(20);}else{d.setTextColor(150);}
        d.text(l||"-",x+cw-6,y+12.5,{align:"right"});}
      y+=rh;}
    y+=14;d.setFontSize(9);
    if(f.scale){f.scale.forEach((o,k)=>{need(13);d.setFont("helvetica","bold");d.setTextColor(20);d.text(LT(k),M,y);d.setFont("helvetica","normal");d.text(lat(o),M+16,y);y+=13;});}
    else{need(13);d.setFont("helvetica","normal");d.setTextColor(100);d.text(lat("La letra es la posición de la opción elegida en esa pregunta (A es la primera). El texto está en el detalle."),M,y);y+=13;}
    y+=18;sub("Detalle");d.setDrawColor(190);d.setLineWidth(.5);d.line(M,y,W-M,y);y+=2;
    f.items.forEach((it,i)=>{d.setFontSize(9);
      const a=answerText(f,i),t1=d.splitTextToSize(lat(it.t),wT),t2=d.splitTextToSize(lat(a||"Sin responder"),wA),h=Math.max(t1.length,t2.length)*11+7;
      need(h);d.setFont("helvetica","normal");d.setTextColor(110);d.text(lat(it.n),M,y+10);
      d.setTextColor(20);d.text(t1,M+wN,y+10);
      if(a){d.setFont("helvetica","bold");}else{d.setTextColor(150);}
      d.text(t2,M+wN+wT+16,y+10);y+=h;d.setDrawColor(225);d.setLineWidth(.4);d.line(M,y,W-M,y);});
  });
  const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(9);d.setTextColor(60);d.setFont("helvetica","bold");d.text(lat(pageCode[i]||""),M,H-24);
    d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(140);d.text(lat((p.nombre?p.nombre+"   ":"")+"Sin puntaje ni interpretación"),M+70,H-24);d.text("Svar by fuge1618   "+i+" / "+n,W-M,H-24,{align:"right"});}
  return d.output("blob");
}
async function saveFile(filename,blob){
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);return"saved";}catch(e){return"fail";}
}

(async()=>{
  TEMA=ls.get("svar.tema")||"auto";applyTheme();
  const mk=location.hash.match(/^#k=([a-z0-9]{8})/),ms=location.hash.match(/^#s=([\w-]+)/);let roto=false,sinred=false,packed=null,sid="";
  if(mk){sid=mk[1];packed=ls.get("svar.k."+sid);
    if(typeof packed!=="string"){packed=null;try{const r=await fetch(API+"/f/"+sid);if(r.ok){packed=(await r.text()).trim();ls.set("svar.k."+sid,packed);}else if(r.status===404)roto=true;else sinred=true;}catch(e){sinred=true;}}}
  else if(ms){packed=ms[1];sid=hash(packed);}
  if(packed){try{const o=await unpack(packed);P={e:String(o.e||""),d:String(o.d||""),m:String(o.m||""),forms:(o.f||[]).map(fromWire).filter(f=>f.items.length)};if(!P.forms.length)throw 0;
      MODE="pac";KEY="svar.p."+sid;const s=ls.get(KEY);if(s&&typeof s==="object")S=Object.assign(S,s);}catch(e){roto=true;}}
  if(MODE==="pro"){const p=ls.get("svar.pro");if(p&&typeof p==="object")PRO=Object.assign(PRO,p);}
  V={name:MODE==="pac"?(datosOk()?"inicio":"datos"):sinred?"sinred":roto?"roto":profOk()?"pro":"perfil"};render(false);
  setTimeout(()=>{const s=document.getElementById("splash");if(s)s.remove();},1700);
})();
